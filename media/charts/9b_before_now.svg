<svg xmlns="http://www.w3.org/2000/svg" width="760" height="462" viewBox="0 0 760 462" role="img" aria-labelledby="title desc">
<title id="title">Qwen3.5-9B before this pass and now: median tool calls per job</title>
<desc id="desc">Median tool calls and runs passed, before this pass then now. Pick up the block and put it back: 7 calls, 2/2 passed, then 3 calls, 3/3 passed; The same, with the block bumped up to 35 mm: 24 calls, 4/8 passed, then 4 calls, 9/9 passed; The same, with a frozen wrist sensor: 10 calls, 2/2 passed, then 6 calls, 9/9 passed; "Reach for the block" with a dead elbow: hand it to a person: 4 calls, 2/2 passed, then 3 calls, 9/9 passed; "Wave at me" while a person has frozen the arm: 2 calls, 2/2 passed, then 1 calls, 3/3 passed.</desc>
<style>
.bg{fill:#ffffff}
.t1{fill:#0b0b0b}.t2{fill:#52514e}.t3{fill:#6e6d68}
.axis{stroke:#c3c2b7}.link{stroke:#c3c2b7}
.pale{fill:#86b6ef}.strong{fill:#256abf}
.ring{stroke:#ffffff}.gap{fill:#ffffff}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}
.t1{fill:#f0efec}.t2{fill:#c3c2b7}.t3{fill:#9a998f}
.axis{stroke:#3d3d3a}.link{stroke:#4a4a46}
.pale{fill:#1c5cab}.strong{fill:#5598e7}
.ring{stroke:#0d1117}.gap{fill:#0d1117}
}
text{font-family:system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif}
.b{font-weight:600}
</style>
<rect class="bg" width="760" height="462" rx="6"/>
<text x="24" y="36" class="t1 b" font-size="17">The 9B now takes fewer tool calls on each job it ran before</text>
<text x="24" y="58" class="t2" font-size="13">Qwen3.5-9B, median tool calls per job: before this pass, and now (commit a4128c9).</text>
<text x="24" y="76" class="t2" font-size="13">The five jobs with a “before” cell in the table. Right: runs passed.</text>
<circle cx="30" cy="98" r="5.5" class="pale ring" stroke-width="2"/>
<text x="42" y="102" class="t2" font-size="12">Before this pass</text>
<circle cx="162" cy="98" r="5.5" class="strong ring" stroke-width="2"/>
<text x="174" y="102" class="t2" font-size="12">Now</text>
<text x="736" y="102" class="t2 b" font-size="12" text-anchor="end">Runs passed</text>
<text x="24" y="138" class="t1" font-size="13">Pick up the block and put it back</text>
<line x1="105.92" y1="158" x2="188.48" y2="158" class="link" stroke-width="2" stroke-linecap="round"/>
<circle cx="188.48" cy="158" r="5.5" class="pale ring" stroke-width="2"/>
<circle cx="105.92" cy="158" r="5.5" class="strong ring" stroke-width="2"/>
<text x="94.92" y="162" class="t1" font-size="12" text-anchor="end">3</text>
<text x="199.48" y="162" class="t2" font-size="12">7</text>
<text x="736" y="162" class="t2" font-size="13" text-anchor="end">2/2 → 3/3</text>
<text x="24" y="192" class="t1 b" font-size="13">The same, with the block bumped up to 35 mm</text>
<line x1="126.56" y1="212" x2="539.36" y2="212" class="link" stroke-width="2" stroke-linecap="round"/>
<circle cx="539.36" cy="212" r="5.5" class="pale ring" stroke-width="2"/>
<circle cx="126.56" cy="212" r="5.5" class="strong ring" stroke-width="2"/>
<text x="115.56" y="216" class="t1" font-size="12" text-anchor="end">4</text>
<text x="550.36" y="216" class="t2" font-size="12">24</text>
<text x="736" y="216" class="t1 b" font-size="13" text-anchor="end">4/8 → 9/9</text>
<text x="24" y="246" class="t1" font-size="13">The same, with a frozen wrist sensor</text>
<line x1="167.84" y1="266" x2="250.4" y2="266" class="link" stroke-width="2" stroke-linecap="round"/>
