<text x="250.4" y="418" class="t3" font-size="11" text-anchor="middle">10</text>
<line x1="353.6" y1="400" x2="353.6" y2="404" class="axis" stroke-width="1"/>
<text x="353.6" y="418" class="t3" font-size="11" text-anchor="middle">15</text>
<line x1="456.8" y1="400" x2="456.8" y2="404" class="axis" stroke-width="1"/>
<text x="456.8" y="418" class="t3" font-size="11" text-anchor="middle">20</text>
