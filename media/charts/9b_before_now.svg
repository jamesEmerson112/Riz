<text x="137.56" y="324" class="t2" font-size="12">4</text>
<text x="736" y="324" class="t2" font-size="13" text-anchor="end">2/2 → 9/9</text>
<text x="24" y="354" class="t1" font-size="13">"Wave at me" while a person has frozen the arm</text>
<line x1="64.64" y1="374" x2="85.28" y2="374" class="link" stroke-width="2" stroke-linecap="round"/>
<circle cx="85.28" cy="374" r="5.5" class="pale ring" stroke-width="2"/>
<circle cx="64.64" cy="374" r="5.5" class="strong ring" stroke-width="2"/>
